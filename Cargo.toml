[package]
name = "postgres-audit-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only PostgreSQL security log triage and independently anchored evidence bundles"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.59"
tempfile = "3"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
