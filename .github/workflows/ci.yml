name: Rust and real PostgreSQL defensive lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  postgres-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: python3 scripts/run_postgres_lab.py --bindir /usr/lib/postgresql/16/bin --work-dir "$RUNNER_TEMP/bank-lab" --transfers examples/financial-crime/transfers.jsonl
      - run: cargo run --release --locked -- scan --input "$RUNNER_TEMP/bank-lab/postgres-cases.jsonl" --bundle "$RUNNER_TEMP/bank-case"
      - run: python3 scripts/check_lab.py "$RUNNER_TEMP/bank-case"
      - run: cargo run --release --locked -- triage-transfers --input "$RUNNER_TEMP/bank-lab/postgres-transfers.jsonl" --output "$RUNNER_TEMP/transfer-report.json"
      - run: python3 scripts/check_transfers.py "$RUNNER_TEMP/transfer-report.json"
      - run: python3 scripts/check_analyst_case.py --input "$RUNNER_TEMP/bank-lab/postgres-transfers.jsonl" --report "$RUNNER_TEMP/transfer-report.json" --work-dir "$RUNNER_TEMP/analyst-review"
